[project]
name = "time-image"
version = "2.0.0"
description = "A single dependency-free ComfyUI node that aligns an image and mask to divisible dimensions."
requires-python = ">=3.10"
# Only numpy / torch / Pillow are needed, all already provided by ComfyUI.
# Never list torch here: pip may replace ComfyUI's CUDA build with a CPU wheel.
dependencies = []
# The whole package is original code under MIT; no third-party code is bundled.
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/shiguanggougouo/Time-image"
"Bug Tracker" = "https://github.com/shiguanggougouo/Time-image/issues"

[tool.comfy]
PublisherId = "timeai1024"
DisplayName = "Time image"
requires-comfyui = ">=1.0.0"
