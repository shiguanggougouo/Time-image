[project]
name = "time-image"
version = "1.0.1"
description = "Standalone ComfyUI nodes for image/mask resolution fitting, pose extraction, and depth extraction."
requires-python = ">=3.10"
# Core nodes only need torch / numpy / Pillow, which ComfyUI already provides.
# Optional: onnxruntime (DWPose), huggingface_hub (model auto-download).
# Never list torch here: pip may replace ComfyUI's CUDA build with a CPU wheel.
dependencies = []
# Mixed licensing: original code is MIT, bundled OpenPose code is CMU
# non-commercial research only. See LICENSE and NOTICE.md before any use.
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/shiguanggougouo/Time-image"
"Bug Tracker" = "https://github.com/shiguanggougouo/Time-image/issues"

[tool.comfy]
PublisherId = "timeai1024"
DisplayName = "Time image"
requires-comfyui = ">=1.0.0"
