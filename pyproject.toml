[project]
name = "time-image"
version = "2.6.2"
description = "Eight ComfyUI utility nodes: prompt + images + resolution, image/mask alignment, panorama viewer, cache cleaner, AI-edit compositing, completion sound, GGUF UNET loader, and canvas text label."
requires-python = ">=3.10"
# NumPy, torch and Pillow are provided by ComfyUI. OpenCV is optional at import
# time and is available in the target runtime; the new node reports a clear
# error if another installation does not provide cv2.
# Never list torch here: pip may replace ComfyUI's CUDA build with a CPU wheel.
dependencies = []
# The whole package is original code under MIT; no third-party code is bundled.
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/shiguanggougouo/Time-image"
"Bug Tracker" = "https://github.com/shiguanggougouo/Time-image/issues"

[tool.comfy]
PublisherId = "timeai1024"
DisplayName = "Time image"
requires-comfyui = ">=1.0.0"
